apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-summary-frontend
  namespace: todo-prod
  labels:
    app: todo-summary-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-summary-frontend
  template:
    metadata:
      labels:
        app: todo-summary-frontend
    spec:
      containers:
        - name: todo-summary-frontend
          image: venkateshsindagi/todo-summary-frontend:3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
